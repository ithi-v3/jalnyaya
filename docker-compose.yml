version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: jalnyaya-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jalnyaya_db
      MYSQL_USER: jalnyaya_user
      MYSQL_PASSWORD: jalnyaya123
    ports:
      - "3307:3306"
    volumes:
      - jalnyaya_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jalnyaya-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "mysql://jalnyaya_user:jalnyaya123@db:3306/jalnyaya_db"
      PORT: 5000
      JWT_SECRET: "jalnyaya_super_secure_jwt_secret_token_key_2026"
      NODE_ENV: "production"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "5000:5000"

volumes:
  jalnyaya_mysql_data:
