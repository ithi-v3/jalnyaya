services:
  db:
    image: mysql:8.0
    container_name: jalnyaya-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jalnyaya_db
      MYSQL_USER: jalnyaya_user
      MYSQL_PASSWORD: jalnyaya123
    ports:
      - "3307:3306"
    volumes:
      - jalnyaya_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  jalnyaya_mysql_data:
